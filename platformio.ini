; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; --------------------------------------------------
; Los tres entornos principales (persistentos1/2/3)
; compilan el MISMO src/main.cpp -- un solo kernel
; compartido (BootManager, FRAM, SensorService,
; CommunicationService, EnergyManager, AlarmManager),
; parametrizado por -DPERSISTENT_OS_NODE_ID. Config.h
; decide, segun ese ID, el rol Bluetooth (maestro o
; esclavo), el primary obligatorio y el secondary
; opcional de cada nodo -- ver el bloque "Rol y peers
; por nodo" en include/Config/Config.h.
;
; src/node2/main_node2.cpp queda excluido de todos los
; entornos: es el firmware minimo original, mantenido
; solo como referencia historica.
; --------------------------------------------------

[env:persistentos1]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<node2/> -<report/main_prueba_reporte.cpp>
build_flags =
	-DPERSISTENT_OS_NODE_ID=1
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6

[env:persistentos2]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<node2/> -<report/main_prueba_reporte.cpp>
build_flags =
	-DPERSISTENT_OS_NODE_ID=2
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6

; PersistentOS3 no requiere FRAM ni sensor conectados
; para funcionar (SensorService reporta "no conectado"
; y sigue de largo, ver SensorService.cpp); alcanza con
; que el ESP32 se anuncie con este nombre. A diferencia
; del firmware original, Node 3 no es solo un esclavo:
; en Config.h tiene rol maestro propio, con PersistentOS2
; como primary y PersistentOS1 como secondary opcional --
; la misma capacidad de iniciativa que Node 1.
[env:persistentos3]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<node2/> -<report/main_prueba_reporte.cpp>
build_flags =
	-DPERSISTENT_OS_NODE_ID=3
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6

; --------------------------------------------------
; Build de reporte para el paper: reemplaza main.cpp por
; src/report/main_prueba_reporte.cpp sobre ese mismo
; kernel compartido -- agrega tageo de escenario (manual
; con 'b'/'c'/'h', o automatico con 'r', Seccion de
; Resultados del paper) y trazas por Serial listas para
; tools/plot_report.py. Todo lo demas (identidad de nodo,
; alarmas con relevo, tabla de nodos conocidos, rotacion
; al secondary) es igual que en los entornos principales.
;
; Por defecto compila como Node 1. Para capturar del lado
; de otro nodo, cambia el -DPERSISTENT_OS_NODE_ID de abajo
; (2 o 3) antes de subir -- es la unica linea que cambia.
;
; pio run -e persistentos_reporte -t upload
; python tools/capture_report.py <puerto>
; python tools/plot_report.py run.log
; --------------------------------------------------
[env:persistentos_reporte]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<node2/> -<main.cpp>
build_flags =
	-DPERSISTENT_OS_NODE_ID=1
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6

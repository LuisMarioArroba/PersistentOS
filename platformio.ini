; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; --------------------------------------------------
; PersistentOS1 - nodo principal (arquitectura completa)
;
; Compila todo src/ excepto src/node2/, que pertenece
; al firmware del nodo receptor.
; pio run -e persistentos1 -t upload
; --------------------------------------------------
[env:persistentos1]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<node2/>
build_flags =
	-DPERSISTENT_OS_NODE_ID=1
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6

; --------------------------------------------------
; PersistentOS2 - nodo receptor (firmware mínimo)
;
; Compila únicamente src/node2/, que es autocontenido
; y no depende del resto del kernel/servicios.
; pio run -e persistentos2 -t upload
; --------------------------------------------------
[env:persistentos2]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<node2/*>
build_flags =
	-DPERSISTENT_OS_NODE_ID=2

; --------------------------------------------------
; PersistentOS1 - build de reporte para el paper
;
; Igual a persistentos1, pero reemplaza main.cpp por
; src/report/main_prueba_reporte.cpp: agrega tageo de
; escenario (Sección de Resultados del paper) y trazas
; CSV ("RPT,...") por Serial, listas para tools/plot_report.py.
; pio run -e persistentos1_reporte -t upload
; pio device monitor -e persistentos1_reporte > run.log
; --------------------------------------------------
[env:persistentos1_reporte]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<node2/> -<main.cpp>
build_flags =
	-DPERSISTENT_OS_NODE_ID=1
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
